<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Soul Keznit · Remake</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Soul Keznit Remake: plataformas oscuro y difícil. Juega gratis en el navegador, con teclado, mando o en el móvil.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soul Keznit">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preload" href="assets/pixelify-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/img/sk2/emblema.svg" type="image/svg+xml">
<style>
@font-face{font-family:"EB Garamond";src:url(/fonts/garamond-italic.woff2) format('woff2');font-style:italic;font-weight:400 800;font-display:swap}
@font-face{font-family:SKPixel;src:url(assets/pixelify-400-latin.woff2) format('woff2');font-weight:400 700;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2190-2193,U+2212}
@font-face{font-family:SKPixel;src:url(assets/pixelify-400-latin-ext.woff2) format('woff2');font-weight:400 700;unicode-range:U+0100-024F}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:absolute;display:block;image-rendering:auto;outline:none}
body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* Controles táctiles */
#pad [data-k],#padTop{position:fixed;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.22);color:#fff;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none;padding:0;cursor:pointer;
  transition:background .08s,transform .08s,border-color .08s}
#pad [data-k] svg{width:42%;height:42%;fill:rgba(255,255,255,.85)}
#pad [data-k].on{background:rgba(255,255,255,.32);border-color:#fff;transform:scale(.94)}
#pad .pd-jump.on{background:rgba(255,52,52,.55);border-color:#ff5a5a}
#pad[hidden],#padTop[hidden],#rotHint[hidden]{display:none}
/* horizontal: en las esquinas */
#pad .pd-move [data-k]{width:clamp(64px,19vh,96px);height:clamp(64px,19vh,96px);bottom:calc(14px + env(safe-area-inset-bottom))}
#pad [data-k="left"]{left:calc(14px + env(safe-area-inset-left))}
#pad [data-k="right"]{left:calc(22px + clamp(64px,19vh,96px) + env(safe-area-inset-left))}
#pad .pd-jump{width:clamp(76px,23vh,116px);height:clamp(76px,23vh,116px);right:calc(16px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom))}
#pad .pd-down{width:clamp(44px,12vh,60px);height:clamp(44px,12vh,60px);right:calc(28px + clamp(76px,23vh,116px) + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom))}
#padTop{width:44px;height:44px;border-radius:14px;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));font:700 14px system-ui,sans-serif;letter-spacing:-.05em}
/* vertical: juego arriba y mando grande abajo */
body.portrait #pad .pd-move [data-k]{width:26vw;height:26vw;max-width:120px;max-height:120px;bottom:calc(9vh + env(safe-area-inset-bottom))}
body.portrait #pad [data-k="left"]{left:5vw}
body.portrait #pad [data-k="right"]{left:calc(8vw + min(26vw,120px))}
body.portrait #pad .pd-jump{width:32vw;height:32vw;max-width:150px;max-height:150px;right:6vw;bottom:calc(8vh + env(safe-area-inset-bottom))}
body.portrait #pad .pd-down{width:16vw;height:16vw;max-width:70px;max-height:70px;right:calc(6vw + min(32vw,150px) - 12vw);bottom:calc(8vh + min(32vw,150px) + 16px + env(safe-area-inset-bottom))}
#rotHint{position:fixed;left:0;right:0;bottom:calc(2vh + env(safe-area-inset-bottom));margin:0;text-align:center;font:12px SKPixel,monospace;color:rgba(255,255,255,.35);letter-spacing:.05em}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Soul Keznit Remake"></canvas>
<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script>document.getElementById('game').focus();</script>
</body>
</html>
